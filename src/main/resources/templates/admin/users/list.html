<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users Management - FAE Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>
<body class="bg-gray-100 font-sans flex min-h-screen">

  <!-- Sidebar Fragment -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeNav})}"></div>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
    
    <!-- Header Fragment -->
    <div th:replace="~{admin/fragments/header :: header('User Accounts')}"></div>

    <!-- Main Content Area -->
    <main class="p-8 flex-1">
      
      <!-- Action Bar & Search Header -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
        
        <!-- Search Form -->
        <form th:action="@{/admin/users}" method="get" class="flex items-center gap-2 w-full sm:w-auto">
          <div class="relative w-full sm:w-80">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </span>
            <input type="text" name="q" th:value="${q}" placeholder="Search by name, email, or phone..."
                   class="w-full pl-10 pr-4 py-2.5 text-sm bg-white border border-gray-300 rounded-xl focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
          </div>
          <button type="submit" class="px-4 py-2.5 bg-gray-800 hover:bg-gray-900 text-white rounded-xl text-sm font-medium transition-colors">
            Search
          </button>
          <a th:if="${q != null and !q.isBlank()}" th:href="@{/admin/users}" class="px-3 py-2.5 text-gray-500 hover:text-gray-700 text-sm">Clear</a>
        </form>

        <!-- Create Button -->
        <a th:href="@{/admin/users/new}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-[#005E3C] hover:bg-[#2F9657] text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all text-sm w-full sm:w-auto justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          <span>Create New User</span>
        </a>
      </div>

      <!-- Flash Messages -->
      <div th:if="${successMessage}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-[#2F9657] text-sm flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span th:text="${successMessage}">Operation successful.</span>
        </div>
      </div>

      <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-3 shadow-sm">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span th:text="${errorMessage}">An error occurred.</span>
      </div>

      <!-- Table Container -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50/80 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <th class="py-4 px-6">User</th>
                <th class="py-4 px-6">Phone</th>
                <th class="py-4 px-6">Role</th>
                <th class="py-4 px-6">Status</th>
                <th class="py-4 px-6 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
              <tr th:if="${#lists.isEmpty(users.content)}" class="hover:bg-gray-50/50 transition-colors">
                <td colspan="5" class="py-12 text-center text-gray-500">
                  <div class="max-w-xs mx-auto">
                    <svg class="w-10 h-10 mx-auto text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                    <p class="font-medium text-gray-800">No users found</p>
                    <p class="text-xs text-gray-400 mt-1">Try adjusting your search criteria or add a user.</p>
                  </div>
                </td>
              </tr>

              <tr th:each="user : ${users.content}" class="hover:bg-gray-50/50 transition-colors group">
                <!-- User Info -->
                <td class="py-4 px-6">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#EBF7F0] text-[#005E3C] font-bold flex items-center justify-center flex-shrink-0">
                      <span th:text="${user.name != null ? #strings.substring(user.name, 0, 1).toUpperCase() : 'U'}">U</span>
                    </div>
                    <div>
                      <p class="font-semibold text-gray-900" th:text="${user.name}">John Doe</p>
                      <p class="text-xs text-gray-500" th:text="${user.email}">john@example.com</p>
                    </div>
                  </div>
                </td>

                <!-- Phone -->
                <td class="py-4 px-6 text-gray-600" th:text="${user.phone != null ? user.phone : '—'}">+1 234 567 890</td>

                <!-- Role Badge -->
                <td class="py-4 px-6">
                  <span th:if="${user.role != null}" 
                        class="px-2.5 py-1 text-xs font-semibold rounded-full bg-[#EBF7F0] text-[#005E3C] border border-[#2F9657]/20"
                        th:text="${user.role.name}">
                    Administrator
                  </span>
                  <span th:unless="${user.role != null}" class="text-gray-400 text-xs">No Role</span>
                </td>

                <!-- Status -->
                <td class="py-4 px-6">
                  <span th:if="${user.active}" class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-800">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Active
                  </span>
                  <span th:unless="${user.active}" class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-full bg-gray-100 text-gray-600">
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-400"></span> Inactive
                  </span>
                </td>

                <!-- Actions -->
                <td class="py-4 px-6 text-right">
                  <div class="flex items-center justify-end gap-2">
                    
                    <!-- Edit -->
                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="p-1.5 text-gray-500 hover:text-[#005E3C] hover:bg-emerald-50 rounded-lg transition-colors" title="Edit">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                      </svg>
                    </a>

                    <!-- Toggle Status (Activate / Deactivate) -->
                    <form th:if="${user.active}" th:action="@{/admin/users/{id}/deactivate(id=${user.id})}" method="post" class="inline">
                      <button type="submit" class="p-1.5 text-gray-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition-colors" title="Deactivate">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
                        </svg>
                      </button>
                    </form>

                    <form th:unless="${user.active}" th:action="@{/admin/users/{id}/activate(id=${user.id})}" method="post" class="inline">
                      <button type="submit" class="p-1.5 text-gray-500 hover:text-[#2F9657] hover:bg-emerald-50 rounded-lg transition-colors" title="Activate">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                      </button>
                    </form>

                    <!-- Delete -->
                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete this user?');">
                      <button type="submit" class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                      </button>
                    </form>

                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Pagination Controls -->
        <div th:if="${users.totalPages > 1}" class="px-6 py-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-600 bg-gray-50/50">
          <p>
            Showing <span class="font-semibold text-gray-800" th:text="${users.pageNumber * users.pageSize + 1}">1</span>
            to <span class="font-semibold text-gray-800" th:text="${#numbers.sequence(1, users.totalPages).size() == users.pageNumber + 1 ? users.totalElements : (users.pageNumber + 1) * users.pageSize}">20</span>
            of <span class="font-semibold text-gray-800" th:text="${users.totalElements}">50</span> users
          </p>

          <div class="flex items-center gap-1">
            <a th:href="@{/admin/users(page=${users.pageNumber - 1}, q=${q})}"
               th:classappend="${users.first} ? 'pointer-events-none opacity-40' : ''"
               class="px-3 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 font-medium transition-colors">
              Previous
            </a>
            <a th:href="@{/admin/users(page=${users.pageNumber + 1}, q=${q})}"
               th:classappend="${users.last} ? 'pointer-events-none opacity-40' : ''"
               class="px-3 py-1.5 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 font-medium transition-colors">
              Next
            </a>
          </div>
        </div>

      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
  </div>

</body>
</html>
