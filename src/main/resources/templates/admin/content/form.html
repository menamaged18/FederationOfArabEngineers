<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${mode == 'create' ? 'Create Content' : 'Edit Content'} + ' - FAE Admin Portal'">Content Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>
<body class="bg-gray-100 font-sans flex min-h-screen">

  <!-- Sidebar Fragment -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeNav})}"></div>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
    
    <!-- Header Fragment -->
    <div th:replace="~{admin/fragments/header :: header(${mode == 'create' ? 'Create Content Entry' : 'Edit Content Entry'})}"></div>

    <main class="p-8 flex-1 max-w-4xl">
      
      <!-- Back Link -->
      <div class="mb-6">
        <a th:href="@{/admin/contents}" class="inline-flex items-center gap-2 text-sm text-gray-600 hover:text-[#005E3C] font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to Content List
        </a>
      </div>

      <!-- Form Container -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-8">
          
          <form th:action="${mode == 'create'} ? @{/admin/contents} : @{/admin/contents/{id}(id=${contentId})}"
                th:object="${content}" 
                method="post" 
                class="space-y-6">

            <!-- Title & Slug -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="title" class="block text-sm font-semibold text-gray-700 mb-1.5">Title *</label>
                <input type="text" id="title" th:field="*{title}" required placeholder="Headline or Title"
                       class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-xs text-red-600"></p>
              </div>

              <div>
                <label for="slug" class="block text-sm font-semibold text-gray-700 mb-1.5">URL Slug *</label>
                <input type="text" id="slug" th:field="*{slug}" required placeholder="headline-or-title"
                       class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all font-mono"/>
                <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}" class="mt-1 text-xs text-red-600"></p>
              </div>
            </div>

            <!-- Content Type & Event Date -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="contentTypeId" class="block text-sm font-semibold text-gray-700 mb-1.5">Content Type *</label>
                <select id="contentTypeId" th:field="*{contentTypeId}" required
                        class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all">
                  <option value="">-- Select Content Type --</option>
                  <option th:each="type : ${contentTypes}" th:value="${type.id}" th:text="${type.name}">News Article</option>
                </select>
                <p th:if="${#fields.hasErrors('contentTypeId')}" th:errors="*{contentTypeId}" class="mt-1 text-xs text-red-600"></p>
              </div>

              <div>
                <label for="eventDate" class="block text-sm font-semibold text-gray-700 mb-1.5">Event Date (Optional)</label>
                <input type="date" id="eventDate" th:field="*{eventDate}"
                       class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
                <p th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}" class="mt-1 text-xs text-red-600"></p>
              </div>
            </div>

            <!-- Image Path / Cover Graphic URL -->
            <div>
              <label for="imagePath" class="block text-sm font-semibold text-gray-700 mb-1.5">Cover Image Path / URL</label>
              <input type="text" id="imagePath" th:field="*{imagePath}" placeholder="/uploads/images/cover.jpg"
                     class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all font-mono"/>
              <p th:if="${#fields.hasErrors('imagePath')}" th:errors="*{imagePath}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- Description / Body -->
            <div>
              <label for="description" class="block text-sm font-semibold text-gray-700 mb-1.5">Description / Content Body</label>
              <textarea id="description" th:field="*{description}" rows="6" placeholder="Main body text, HTML, or structured description..."
                        class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"></textarea>
              <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- Is Published Checkbox -->
            <div class="pt-2">
              <label class="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" th:field="*{isPublished}" class="w-5 h-5 rounded border-gray-300 text-[#005E3C] focus:ring-[#2F9657]"/>
                <div>
                  <span class="text-sm font-semibold text-gray-800">Publish immediately</span>
                  <p class="text-xs text-gray-500">Uncheck to save as a draft.</p>
                </div>
              </label>
            </div>

            <!-- Form Action Buttons -->
            <div class="pt-6 border-t border-gray-100 flex items-center justify-end gap-3">
              <a th:href="@{/admin/contents}" class="px-5 py-2.5 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-xl text-sm transition-colors">
                Cancel
              </a>
              <button type="submit" class="px-6 py-2.5 bg-[#005E3C] hover:bg-[#2F9657] text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                <span th:text="${mode == 'create' ? 'Create Content' : 'Save Changes'}">Submit</span>
              </button>
            </div>

          </form>

        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
  </div>

</body>
</html>
