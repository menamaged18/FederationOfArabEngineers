spring.application.name=admin-portal

# spring.datasource.url=jdbc:mysql://localhost:3306/myappdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3307/myappdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=appuser
spring.datasource.password=apppassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Custom path for Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Enable sorting tags and operations alphabetically
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Display actual request duration in Swagger UI
springdoc.swagger-ui.display-request-duration=true

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000


# Enable SQL initialization
spring.sql.init.mode=always

# Defer initialization until Hibernate DDL execution completes
spring.jpa.defer-datasource-initialization=true

# Keep database-specific SQL logs readable (optional)
spring.jpa.show-sql=true