<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${mode == 'create' ? 'Create User' : 'Edit User'} + ' - FAE Admin Portal'">User Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>
<body class="bg-gray-100 font-sans flex min-h-screen">

  <!-- Sidebar Fragment -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeNav})}"></div>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
    
    <!-- Header Fragment -->
    <div th:replace="~{admin/fragments/header :: header(${mode == 'create' ? 'Create User Account' : 'Edit User Account'})}"></div>

    <main class="p-8 flex-1 max-w-4xl">
      
      <!-- Back Action -->
      <div class="mb-6">
        <a th:href="@{/admin/users}" class="inline-flex items-center gap-2 text-sm text-gray-600 hover:text-[#005E3C] font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to User Accounts
        </a>
      </div>

      <!-- Form Container -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-8">
          
          <form th:action="${mode == 'create'} ? @{/admin/users} : @{/admin/users/{id}(id=${userId})}"
                th:object="${user}" 
                method="post" 
                class="space-y-6">

            <!-- Full Name -->
            <div>
              <label for="name" class="block text-sm font-semibold text-gray-700 mb-1.5">Full Name *</label>
              <input type="text" id="name" th:field="*{name}" required placeholder="e.g. Jane Doe"
                     class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
              <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- Grid: Email & Phone -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1.5">Email Address *</label>
                <input type="email" id="email" th:field="*{email}" required placeholder="jane@example.com"
                       class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-xs text-red-600"></p>
              </div>

              <div>
                <label for="phone" class="block text-sm font-semibold text-gray-700 mb-1.5">Phone Number</label>
                <input type="text" id="phone" th:field="*{phone}" placeholder="+1 234 567 890"
                       class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="mt-1 text-xs text-red-600"></p>
              </div>
            </div>

            <!-- Password Field (Conditional for Create) -->
            <div th:if="${mode == 'create'}">
              <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">Password *</label>
              <input type="password" id="password" th:field="*{password}" required placeholder="••••••••"
                     class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
              <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- Grid: Role Select & Active Checkbox -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
              <div>
                <label for="roleId" class="block text-sm font-semibold text-gray-700 mb-1.5">Assign Role *</label>
                <select id="roleId" th:field="*{roleId}" required
                        class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all">
                  <option value="">-- Select Role --</option>
                  <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}">Administrator</option>
                </select>
                <p th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}" class="mt-1 text-xs text-red-600"></p>
              </div>

              <!-- Active status checkbox only available on creation -->
              <div th:if="${mode == 'create'}" class="pt-6">
                <label class="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" th:field="*{active}" class="w-5 h-5 rounded border-gray-300 text-[#005E3C] focus:ring-[#2F9657]"/>
                  <span class="text-sm font-medium text-gray-800">Activate user immediately</span>
                </label>
              </div>
            </div>

            <!-- Submit Controls -->
            <div class="pt-6 border-t border-gray-100 flex items-center justify-end gap-3">
              <a th:href="@{/admin/users}" class="px-5 py-2.5 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-xl text-sm transition-colors">
                Cancel
              </a>
              <button type="submit" class="px-6 py-2.5 bg-[#005E3C] hover:bg-[#2F9657] text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                <span th:text="${mode == 'create' ? 'Create User' : 'Save Changes'}">Submit</span>
              </button>
            </div>

          </form>

        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
  </div>

</body>
</html>
