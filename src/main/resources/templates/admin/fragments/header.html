<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header(title)" class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-8 shadow-sm flex-shrink-0">
  <!-- Page Title -->
  <div class="flex items-center gap-3">
    <h1 class="text-xl font-bold text-gray-800" th:text="${title}">Dashboard</h1>
  </div>

  <!-- Actions / Quick Search -->
  <div class="flex items-center gap-4">
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </span>
      <input type="text" placeholder="Search..." 
             class="pl-9 pr-4 py-1.5 text-sm bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-[#2F9657] focus:ring-1 focus:ring-[#2F9657] transition-all w-64"/>
    </div>

    <div class="h-6 w-px bg-gray-200"></div>

    <a th:href="@{/}" target="_blank" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 hover:text-[#005E3C] transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>
      <span>View Site</span>
    </a>
  </div>
</header>

</body>
</html>
