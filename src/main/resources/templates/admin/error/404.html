<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-gray-100">
    <div class="w-20 h-20 bg-[#EBF7F0] text-[#2F9657] rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>
    <h1 class="text-6xl font-extrabold text-[#005E3C] mb-2">404</h1>
    <h2 class="text-2xl font-bold text-gray-800 mb-3">Page Not Found</h2>
    <p class="text-gray-600 mb-8 text-sm leading-relaxed">
      The page you are looking for doesn't exist, has been removed, or is temporarily unavailable.
    </p>
    <a th:href="@{/admin/dashboard}" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-[#005E3C] hover:bg-[#2F9657] text-white font-medium rounded-xl transition-all duration-200 shadow-md hover:shadow-lg w-full">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Back to Safety
    </a>
  </div>
</body>
</html>
