<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Types - FAE Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>
<body class="bg-gray-100 font-sans flex min-h-screen">

  <!-- Sidebar Fragment -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeNav})}"></div>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
    
    <!-- Header Fragment -->
    <div th:replace="~{admin/fragments/header :: header('Content Types')}"></div>

    <main class="p-8 flex-1">
      
      <!-- Top Action Bar -->
      <div class="flex items-center justify-between gap-4 mb-6">
        <div>
          <h2 class="text-lg font-bold text-gray-800">Content Taxonomies</h2>
          <p class="text-xs text-gray-500 mt-0.5">Manage categories and content classifications for the portal.</p>
        </div>

        <a th:href="@{/admin/content-types/new}" class="inline-flex items-center gap-2 px-5 py-2.5 bg-[#005E3C] hover:bg-[#2F9657] text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
          </svg>
          <span>Create Content Type</span>
        </a>
      </div>

      <!-- Flash Messages -->
      <div th:if="${successMessage}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-[#2F9657] text-sm flex items-center gap-3 shadow-sm">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span th:text="${successMessage}">Content type saved successfully.</span>
      </div>

      <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-3 shadow-sm">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span th:text="${errorMessage}">Unable to delete content type.</span>
      </div>

      <!-- Table Container -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-gray-50/80 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <th class="py-4 px-6">ID</th>
                <th class="py-4 px-6">Name</th>
                <th class="py-4 px-6">Slug</th>
                <th class="py-4 px-6 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
              <tr th:if="${#lists.isEmpty(contentTypes)}" class="hover:bg-gray-50/50 transition-colors">
                <td colspan="4" class="py-12 text-center text-gray-500">
                  <p class="font-medium text-gray-800">No content types configured</p>
                </td>
              </tr>

              <tr th:each="type : ${contentTypes}" class="hover:bg-gray-50/50 transition-colors">
                <!-- ID -->
                <td class="py-4 px-6 text-gray-500 text-xs font-mono" th:text="${type.id}">1</td>

                <!-- Name -->
                <td class="py-4 px-6 font-semibold text-gray-900" th:text="${type.name}">News Article</td>

                <!-- Slug -->
                <td class="py-4 px-6">
                  <code class="px-2 py-1 bg-gray-100 text-gray-700 rounded text-xs font-mono" th:text="${type.slug}">news-article</code>
                </td>

                <!-- Actions -->
                <td class="py-4 px-6 text-right">
                  <div class="flex items-center justify-end gap-2">
                    <a th:href="@{/admin/content-types/{id}/edit(id=${type.id})}" class="p-1.5 text-gray-500 hover:text-[#005E3C] hover:bg-emerald-50 rounded-lg transition-colors" title="Edit">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                      </svg>
                    </a>

                    <form th:action="@{/admin/content-types/{id}/delete(id=${type.id})}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete this content type?');">
                      <button type="submit" class="p-1.5 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Delete">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
  </div>

</body>
</html>
