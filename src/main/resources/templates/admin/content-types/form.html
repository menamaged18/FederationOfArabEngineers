<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${mode == 'create' ? 'Create Content Type' : 'Edit Content Type'} + ' - FAE Admin Portal'">Content Type Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
</head>
<body class="bg-gray-100 font-sans flex min-h-screen">

  <!-- Sidebar Fragment -->
  <div th:replace="~{admin/fragments/sidebar :: sidebar(${activeNav})}"></div>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
    
    <!-- Header Fragment -->
    <div th:replace="~{admin/fragments/header :: header(${mode == 'create' ? 'Create Content Type' : 'Edit Content Type'})}"></div>

    <main class="p-8 flex-1 max-w-2xl">
      
      <!-- Back Link -->
      <div class="mb-6">
        <a th:href="@{/admin/content-types}" class="inline-flex items-center gap-2 text-sm text-gray-600 hover:text-[#005E3C] font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to Content Types
        </a>
      </div>

      <!-- Form Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="p-8">
          
          <form th:action="${mode == 'create'} ? @{/admin/content-types} : @{/admin/content-types/{id}(id=${contentTypeId})}"
                th:object="${contentType}" 
                method="post" 
                class="space-y-6">

            <!-- Name -->
            <div>
              <label for="name" class="block text-sm font-semibold text-gray-700 mb-1.5">Type Name *</label>
              <input type="text" id="name" th:field="*{name}" required placeholder="e.g. Press Release"
                     class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all"/>
              <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- Slug -->
            <div>
              <label for="slug" class="block text-sm font-semibold text-gray-700 mb-1.5">Type Slug *</label>
              <input type="text" id="slug" th:field="*{slug}" required placeholder="press-release"
                     class="w-full px-4 py-2.5 text-sm bg-gray-50 border border-gray-300 rounded-xl focus:bg-white focus:outline-none focus:border-[#2F9657] focus:ring-2 focus:ring-[#2F9657]/20 transition-all font-mono"/>
              <p th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}" class="mt-1 text-xs text-red-600"></p>
            </div>

            <!-- Form Action Buttons -->
            <div class="pt-6 border-t border-gray-100 flex items-center justify-end gap-3">
              <a th:href="@{/admin/content-types}" class="px-5 py-2.5 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-xl text-sm transition-colors">
                Cancel
              </a>
              <button type="submit" class="px-6 py-2.5 bg-[#005E3C] hover:bg-[#2F9657] text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                <span th:text="${mode == 'create' ? 'Create Type' : 'Save Changes'}">Submit</span>
              </button>
            </div>

          </form>

        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{admin/fragments/footer :: footer}"></div>
  </div>

</body>
</html>
