<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside th:fragment="sidebar(activePage)" class="w-64 bg-[#005E3C] text-white flex flex-col min-h-screen shadow-xl flex-shrink-0">
  <!-- Brand Logo / Header -->
  <div class="h-16 flex items-center justify-between px-6 bg-[#00472d] border-b border-[#2F9657]/30">
    <a th:href="@{/admin/dashboard}" class="flex items-center gap-3 group">
      <div class="w-9 h-9 rounded-lg bg-white flex items-center justify-center font-bold text-[#005E3C] shadow-md group-hover:scale-105 transition-transform">
        FAE
      </div>
      <span class="font-semibold text-lg tracking-wide text-white">Admin Portal</span>
    </a>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
    <!-- Dashboard -->
    <a th:href="@{/admin/dashboard}"
       th:classappend="${activePage == 'dashboard'} ? 'bg-[#2F9657] text-white font-medium shadow-sm' : 'text-emerald-100 hover:bg-[#2F9657]/40 hover:text-white'"
       class="flex items-center gap-3 px-4 py-3 rounded-lg transition-colors group">
      <svg class="w-5 h-5 opacity-80 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span>Dashboard</span>
    </a>

    <!-- Section: Management -->
    <div class="pt-4 pb-1">
      <p class="px-4 text-xs font-semibold uppercase tracking-wider text-emerald-300/70">Management</p>
    </div>

    <!-- Users -->
    <a th:href="@{/admin/users}"
       th:classappend="${activePage == 'users'} ? 'bg-[#2F9657] text-white font-medium shadow-sm' : 'text-emerald-100 hover:bg-[#2F9657]/40 hover:text-white'"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors group">
      <svg class="w-5 h-5 opacity-80 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <span>User Accounts</span>
    </a>

    <!-- Roles -->
    <a th:href="@{/admin/roles}"
       th:classappend="${activePage == 'roles'} ? 'bg-[#2F9657] text-white font-medium shadow-sm' : 'text-emerald-100 hover:bg-[#2F9657]/40 hover:text-white'"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors group">
      <svg class="w-5 h-5 opacity-80 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
      </svg>
      <span>Roles & Permissions</span>
    </a>

    <!-- Section: Content & Media -->
    <div class="pt-4 pb-1">
      <p class="px-4 text-xs font-semibold uppercase tracking-wider text-emerald-300/70">Content</p>
    </div>

    <!-- Content Items -->
    <a th:href="@{/admin/contents}"
       th:classappend="${activePage == 'contents'} ? 'bg-[#2F9657] text-white font-medium shadow-sm' : 'text-emerald-100 hover:bg-[#2F9657]/40 hover:text-white'"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors group">
      <svg class="w-5 h-5 opacity-80 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
      </svg>
      <span>Content Manager</span>
    </a>

    <!-- Content Types -->
    <a th:href="@{/admin/content-types}"
       th:classappend="${activePage == 'contentTypes'} ? 'bg-[#2F9657] text-white font-medium shadow-sm' : 'text-emerald-100 hover:bg-[#2F9657]/40 hover:text-white'"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors group">
      <svg class="w-5 h-5 opacity-80 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 11h.01M7 15h.01M11 7h8M11 11h8M11 15h8M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z"/>
      </svg>
      <span>Content Types</span>
    </a>

    <!-- Files / Assets -->
    <a th:href="@{/admin/files}"
       th:classappend="${activePage == 'files'} ? 'bg-[#2F9657] text-white font-medium shadow-sm' : 'text-emerald-100 hover:bg-[#2F9657]/40 hover:text-white'"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors group">
      <svg class="w-5 h-5 opacity-80 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <span>Media Library</span>
    </a>

    <!-- Inquiries -->
    <a th:href="@{/admin/contact-us}"
       th:classappend="${activePage == 'contactUs'} ? 'bg-[#2F9657] text-white font-medium shadow-sm' : 'text-emerald-100 hover:bg-[#2F9657]/40 hover:text-white'"
       class="flex items-center gap-3 px-4 py-2.5 rounded-lg transition-colors group">
      <svg class="w-5 h-5 opacity-80 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
      <span>Inquiries</span>
    </a>
  </nav>

  <!-- Footer Profile / Action -->
  <div class="p-4 border-t border-[#2F9657]/30 bg-[#00472d]/50">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3 overflow-hidden">
        <div class="w-8 h-8 rounded-full bg-[#2F9657] text-white flex items-center justify-center font-bold text-sm">
          <span sec:authentication="name != null ? #strings.substring(name, 0, 1).toUpperCase() : 'A'">A</span>
        </div>
        <div class="truncate">
          <p class="text-sm font-medium text-white truncate" sec:authentication="name">Admin</p>
          <p class="text-xs text-emerald-200/80 truncate">Administrator</p>
        </div>
      </div>
      <form th:action="@{/admin/logout}" method="post">
        <button type="submit" class="p-2 text-emerald-200 hover:text-white hover:bg-[#2F9657]/30 rounded-lg transition-colors" title="Logout">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </form>
    </div>
  </div>
</aside>

</body>
</html>
