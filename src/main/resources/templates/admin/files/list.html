<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Management - Admin Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary-color: #005E3C;
            --secondary-color: #2F9657;
        }
        .btn-primary-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }
        .btn-primary-custom:hover {
            background-color: #00472d;
            color: #fff;
        }
        .btn-secondary-custom {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            color: #fff;
        }
        .btn-secondary-custom:hover {
            background-color: #247744;
            color: #fff;
        }
        .badge-brand {
            background-color: var(--primary-color);
            color: #fff;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Header -->
    <div th:replace="~{admin/fragments/header :: header}"></div>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 p-0">
                <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>
            </div>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                
                <!-- Page Title & Actions -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h2" style="color: var(--primary-color);">
                        <i class="fa-solid fa-folder-open me-2"></i>File Assets
                    </h1>
                    <div class="btn-toolbar mb-2 mb-md-0 gap-2">
                        <button type="button" class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#uploadSingleModal">
                            <i class="fa-solid fa-upload me-1"></i> Upload File
                        </button>
                        <button type="button" class="btn btn-secondary-custom" data-bs-toggle="modal" data-bs-target="#uploadMultipleModal">
                            <i class="fa-solid fa-file-circle-plus me-1"></i> Upload Multiple
                        </button>
                    </div>
                </div>

                <!-- Alert Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Files Table -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>File Name</th>
                                        <th>Content Type</th>
                                        <th>Size</th>
                                        <th>Uploaded Date</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="file : ${files.content}">
                                        <td th:text="${file.id}">1</td>
                                        <td>
                                            <i class="fa-regular fa-file me-2 text-secondary"></i>
                                            <span th:text="${file.originalName}">document.pdf</span>
                                        </td>
                                        <td>
                                            <span class="badge bg-secondary" th:text="${file.contentType}">application/pdf</span>
                                        </td>
                                        <td th:text="${file.size}">1024 KB</td>
                                        <td th:text="${#temporals.format(file.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-29 10:00</td>
                                        <td class="text-end">
                                            <a th:href="${file.fileUrl}" target="_blank" class="btn btn-sm btn-outline-secondary me-1" title="View/Download">
                                                <i class="fa-solid fa-arrow-down-long"></i>
                                            </a>
                                            <form th:action="@{/admin/files/{id}/delete(id=${file.id})}" method="post" class="d-inline"
                                                  th:onsubmit="return confirm('Are you sure you want to delete this file?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(files.content)}">
                                        <td colspan="6" class="text-center py-4 text-muted">
                                            <i class="fa-solid fa-inbox fa-2x mb-2"></i>
                                            <p class="mb-0">No files found.</p>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${files.totalPages > 1}" class="d-flex justify-content-center">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${files.pageNumber == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/files(page=${files.pageNumber - 1})}">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, files.totalPages - 1)}"
                            th:classappend="${i == files.pageNumber} ? 'active'">
                            <a class="page-link" th:href="@{/admin/files(page=${i})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${files.pageNumber + 1 == files.totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/files(page=${files.pageNumber + 1})}">Next</a>
                        </li>
                    </ul>
                </nav>

            </main>
        </div>
    </div>

    <!-- Upload Single Modal -->
    <div class="modal fade" id="uploadSingleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form th:action="@{/admin/files/upload}" method="post" enctype="multipart/form-data">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Upload Single File</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="singleFile" class="form-label">Select File</label>
                            <input class="form-control" type="file" id="singleFile" name="file" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom">Upload</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Upload Multiple Modal -->
    <div class="modal fade" id="uploadMultipleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form th:action="@{/admin/files/upload-multiple}" method="post" enctype="multipart/form-data">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Upload Multiple Files</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="multipleFiles" class="form-label">Select Files</label>
                            <input class="form-control" type="file" id="multipleFiles" name="files" multiple required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-secondary-custom">Upload All</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{admin/fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
