<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 - Access Denied</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border border-gray-100">
    <div class="w-20 h-20 bg-[#EBF7F0] text-[#005E3C] rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m8-6V7a4 4 0 00-8 0v4M5 9h14a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V11a2 2 0 012-2z"/>
      </svg>
    </div>
    <h1 class="text-6xl font-extrabold text-[#005E3C] mb-2">403</h1>
    <h2 class="text-2xl font-bold text-gray-800 mb-3">Access Denied</h2>
    <p class="text-gray-600 mb-8 text-sm leading-relaxed">
      You don't have permission to access this resource. Please contact your administrator if you believe this is an error.
    </p>
    <a th:href="@{/admin/dashboard}" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-[#005E3C] hover:bg-[#2F9657] text-white font-medium rounded-xl transition-all duration-200 shadow-md hover:shadow-lg w-full">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      Return to Dashboard
    </a>
  </div>
</body>
</html>
